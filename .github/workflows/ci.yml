name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean
      coverage_diagnostic:
        description: Run development-only native coverage diagnostics instead of aggregate CI
        required: false
        default: false
        type: boolean
      security_diagnostic:
        description: Run development-only native security and bounded checks instead of aggregate CI
        required: false
        default: false
        type: boolean
      root_release_qualification:
        description: Run the complete root release contract with pinned source-built tooling
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      root_release_qualification: ${{ steps.select.outputs.root_release_qualification }}
    steps:
      - id: select
        name: Reject conflicting workflow selectors
        env:
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run || false }}
          COVERAGE_DIAGNOSTIC: ${{ inputs.coverage_diagnostic || false }}
          SECURITY_DIAGNOSTIC: ${{ inputs.security_diagnostic || false }}
          ROOT_RELEASE_QUALIFICATION: ${{ inputs.root_release_qualification || false }}
        run: |
          set -euo pipefail
          selected=0
          for value in "${RELEASE_DRY_RUN}" "${COVERAGE_DIAGNOSTIC}" "${SECURITY_DIAGNOSTIC}" "${ROOT_RELEASE_QUALIFICATION}"; do
            case "${value}" in
              true) selected=$((selected + 1)) ;;
              false) ;;
              *) exit 1 ;;
            esac
          done
          test "${selected}" -le 1
          printf 'root_release_qualification=%s\n' "${ROOT_RELEASE_QUALIFICATION}" >>"${GITHUB_OUTPUT}"

  ci:
    needs: selection
    if: github.event_name != 'workflow_dispatch' || !(inputs.coverage_diagnostic || inputs.security_diagnostic)
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@c7f232472d9c4c5ac5359d70bbef3b8f1571b834 # reviewed security maintenance source
    with:
      tooling_sha: c7f232472d9c4c5ac5359d70bbef3b8f1571b834
      source_bootstrap: true
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}

  coverage-diagnostic:
    name: Native diagnostic (development only)
    needs: selection
    if: github.event_name == 'workflow_dispatch' && (inputs.coverage_diagnostic || inputs.security_diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOWORK: off
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    steps:
      - name: Require exactly one native diagnostic
        env:
          COVERAGE_DIAGNOSTIC: ${{ inputs.coverage_diagnostic }}
          SECURITY_DIAGNOSTIC: ${{ inputs.security_diagnostic }}
        run: |
          set -euo pipefail
          case "${COVERAGE_DIAGNOSTIC}:${SECURITY_DIAGNOSTIC}" in
            true:false|false:true) ;;
            *) exit 1 ;;
          esac
      - name: Initialize task-owned caches
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/lint"
          printf 'GOCACHE=%s\nGOMODCACHE=%s\nGOTMPDIR=%s\nGOLANGCI_LINT_CACHE=%s\nTMPDIR=%s\n' \
            "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" \
            "${TASK_ROOT}/lint" "${TASK_ROOT}/tmp" >>"${GITHUB_ENV}"
      - name: Check out producer at dispatch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: producer
          persist-credentials: false
          fetch-depth: 0
      - name: Check out immutable diagnostic tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 71862edbff6d1cb69e250164ffac0a344eba8e81
          path: coverage-tooling
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build diagnostic tooling
        working-directory: coverage-tooling
        run: |
          set -euo pipefail
          mkdir -p "${GOCACHE}" "${GOMODCACHE}" "${GOTMPDIR}"
          go build -p 1 -trimpath -buildvcs=false -o "${GOTMPDIR}/golib" ./cmd/golib
      - name: Run root native coverage with declared services
        if: inputs.coverage_diagnostic && !inputs.security_diagnostic
        working-directory: producer
        run: |
          set -euo pipefail
          "${GOTMPDIR}/golib" coverage --module .
      - name: Verify pre-fix metadata regression sensitivity
        if: inputs.security_diagnostic && !inputs.coverage_diagnostic
        working-directory: coverage-tooling
        run: |
          set -euo pipefail
          git show 64c08f5d1a5973ee3ebd88e8dbd5bbbda14ab8e7:internal/gates/runner.go >"${GOTMPDIR}/scanner-before.go"
          jq -n --arg source "${PWD}/internal/gates/runner.go" \
            --arg before "${GOTMPDIR}/scanner-before.go" \
            '{Replace: {($source): $before}}' >"${GOTMPDIR}/scanner-before-overlay.json"
          if go test -p 1 -overlay="${GOTMPDIR}/scanner-before-overlay.json" \
            ./internal/gates -run '^TestSecretScannerMetadataHosted$' -count=1 \
            >"${GOTMPDIR}/scanner-before.log" 2>&1; then
            echo 'Pre-fix metadata regression did not fail'
            exit 1
          fi
          if ! grep -q 'missing safe finding location' "${GOTMPDIR}/scanner-before.log"; then
            echo 'Pre-fix regression did not reach the expected assertion'
            exit 1
          fi
          echo 'Pre-fix metadata regression failed at the expected assertion'
      - name: Verify pre-fix decision-digest regression sensitivity
        if: inputs.security_diagnostic && !inputs.coverage_diagnostic
        working-directory: coverage-tooling
        env:
          GOLIB_GITLEAKS_INTEGRATION: '1'
        run: |
          set -euo pipefail
          git show cf41b6984a84deadd0986e6cfe16c7f6e23bc18b:internal/gates/runner.go >"${GOTMPDIR}/policy-before.go"
          jq -n --arg source "${PWD}/internal/gates/runner.go" \
            --arg before "${GOTMPDIR}/policy-before.go" \
            '{Replace: {($source): $before}}' >"${GOTMPDIR}/policy-before-overlay.json"
          if go test -p 1 -overlay="${GOTMPDIR}/policy-before-overlay.json" \
            ./internal/gates -run '^TestJSONAPIDecisionDigestPolicyHosted$' -count=1 \
            >"${GOTMPDIR}/policy-before.log" 2>&1; then
            echo 'Pre-fix decision-digest regression did not fail'
            exit 1
          fi
          if ! grep -q 'git: exact public decision records remain scanner findings (count=23)' "${GOTMPDIR}/policy-before.log" || \
             ! grep -q 'dir: exact public decision records remain scanner findings (count=23)' "${GOTMPDIR}/policy-before.log"; then
            echo 'Pre-fix decision-digest regression did not reach the expected assertion'
            exit 1
          fi
          echo 'Pre-fix decision-digest regression failed at the expected assertion'
      - name: Verify native scanner diagnostics
        if: inputs.security_diagnostic && !inputs.coverage_diagnostic
        working-directory: coverage-tooling
        env:
          GOLIB_GITLEAKS_INTEGRATION: '1'
        run: |
          set -euo pipefail
          go test -p 1 ./internal/gates \
            -run '^(TestJSONAPIDecisionDigestPolicyHosted|TestSecretScannerMetadataHosted|TestSecretScannerFailureClassificationWithoutOutput|TestBoundedProcessOutputNotifiesOnceOutsideLock|TestBoundedProcessOutputNotifiesLateSubscriber|TestLocalRunsBoundedPullRequestContract|TestCheckRunsSecurityTools|TestRunSecurityScansUploadPackHiddenHistory|TestRunSecurityRejectsTransientGitleaksIgnore)$' \
            -count=1
      - name: Run root native security and bounded checks
        if: inputs.security_diagnostic && !inputs.coverage_diagnostic
        working-directory: producer
        run: |
          set -euo pipefail
          "${GOTMPDIR}/golib" check --local --module .
      - name: Remove task-owned diagnostic resources
        if: always()
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -d "${TASK_ROOT}" ]]; then
            find "${TASK_ROOT}" -type d -exec chmod u+w {} +
            find "${TASK_ROOT}" -depth -delete
          fi
          for checkout in "${GITHUB_WORKSPACE}/producer" "${GITHUB_WORKSPACE}/coverage-tooling"; do
            if [[ -d "${checkout}" ]]; then
              find "${checkout}" -type d -exec chmod u+w {} +
              find "${checkout}" -depth -delete
            fi
          done

  root-release-qualification:
    name: Full root release qualification
    needs: [selection, ci]
    if: github.event_name == 'workflow_dispatch' && needs.selection.outputs.root_release_qualification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      GOENV: off
      GOWORK: off
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - name: Initialize private qualification workspace
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-jsonapi-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/lint" "${TASK_ROOT}/xdg" "${TASK_ROOT}/npm"
          printf 'GOCACHE=%s\nGOMODCACHE=%s\nGOTMPDIR=%s\nTMPDIR=%s\nGOLANGCI_LINT_CACHE=%s\nXDG_CACHE_HOME=%s\nnpm_config_cache=%s\n' \
            "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/tmp" \
            "${TASK_ROOT}/lint" "${TASK_ROOT}/xdg" "${TASK_ROOT}/npm" >>"${GITHUB_ENV}"
      - name: Check out complete producer history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-producer
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact supported development tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: dbce31aab4f15b3440e0559d3e2bad8912b6e567
          path: release-tooling
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build honest source-development CLI
        working-directory: release-tooling
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dbce31aab4f15b3440e0559d3e2bad8912b6e567
          go build -p 1 -trimpath -buildvcs=false -o "${GOTMPDIR}/golib" ./cmd/golib
          test "$("${GOTMPDIR}/golib" --version)" = dev
      - name: Validate producer authorities and complete root release contract
        working-directory: release-producer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          "${GOTMPDIR}/golib" repository check
          "${GOTMPDIR}/golib" specification check --online
          "${GOTMPDIR}/golib" release check --module .
          "${GOTMPDIR}/golib" release dry-run --module .
      - name: Retain native qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-release-qualification
          path: release-producer/.verification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Remove private qualification resources
        if: always()
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-jsonapi-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for owned in "${TASK_ROOT}" "${GITHUB_WORKSPACE}/release-producer" "${GITHUB_WORKSPACE}/release-tooling"; do
            if [[ -d "${owned}" ]]; then
              find "${owned}" -type d -exec chmod u+w {} +
              find "${owned}" -depth -delete
            fi
          done

  required:
    name: Required
    if: always()
    needs: [selection, ci, root-release-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          SELECTION_RESULT: ${{ needs.selection.result }}
          ROOT_SELECTED: ${{ needs.selection.outputs.root_release_qualification }}
          ROOT_RESULT: ${{ needs.root-release-qualification.result }}
        run: |
          set -euo pipefail
          test "${SELECTION_RESULT}" = success
          test "${CI_RESULT}" = success
          case "${ROOT_SELECTED}:${ROOT_RESULT}" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
