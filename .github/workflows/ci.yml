name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean
      coverage_diagnostic:
        description: Run development-only native coverage diagnostics instead of aggregate CI
        required: false
        default: false
        type: boolean
      security_diagnostic:
        description: Run development-only native security and bounded checks instead of aggregate CI
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || !(inputs.coverage_diagnostic || inputs.security_diagnostic)
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@47269f1aa78baa637a8c377b0af24c113b34c1c9 # v1.7.2 legacy workflow compatibility
    with:
      tooling_sha: 47269f1aa78baa637a8c377b0af24c113b34c1c9
      release_dry_run: ${{ inputs.release_dry_run || false }}

  coverage-diagnostic:
    name: Native diagnostic (development only)
    if: github.event_name == 'workflow_dispatch' && (inputs.coverage_diagnostic || inputs.security_diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOWORK: off
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    steps:
      - name: Require exactly one native diagnostic
        env:
          COVERAGE_DIAGNOSTIC: ${{ inputs.coverage_diagnostic }}
          SECURITY_DIAGNOSTIC: ${{ inputs.security_diagnostic }}
        run: |
          set -euo pipefail
          case "${COVERAGE_DIAGNOSTIC}:${SECURITY_DIAGNOSTIC}" in
            true:false|false:true) ;;
            *) exit 1 ;;
          esac
      - name: Initialize task-owned caches
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/lint"
          printf 'GOCACHE=%s\nGOMODCACHE=%s\nGOTMPDIR=%s\nGOLANGCI_LINT_CACHE=%s\nTMPDIR=%s\n' \
            "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" \
            "${TASK_ROOT}/lint" "${TASK_ROOT}/tmp" >>"${GITHUB_ENV}"
      - name: Check out producer at dispatch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: producer
          persist-credentials: false
          fetch-depth: 0
      - name: Check out immutable diagnostic tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: faustbrian/go-library-tools
          ref: 1b1d18da0337bcdc0849e6fe8595e7f6a04c85b8
          path: coverage-tooling
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build diagnostic tooling
        working-directory: coverage-tooling
        run: |
          set -euo pipefail
          mkdir -p "${GOCACHE}" "${GOMODCACHE}" "${GOTMPDIR}"
          go build -p 1 -trimpath -buildvcs=false -o "${GOTMPDIR}/golib" ./cmd/golib
      - name: Run root native coverage with declared services
        if: inputs.coverage_diagnostic && !inputs.security_diagnostic
        working-directory: producer
        run: |
          set -euo pipefail
          "${GOTMPDIR}/golib" coverage --module .
      - name: Run root native security and bounded checks
        if: inputs.security_diagnostic && !inputs.coverage_diagnostic
        working-directory: producer
        run: |
          set -euo pipefail
          "${GOTMPDIR}/golib" check --local --module .
      - name: Remove task-owned diagnostic resources
        if: always()
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -d "${TASK_ROOT}" ]]; then
            find "${TASK_ROOT}" -type d -exec chmod u+w {} +
            find "${TASK_ROOT}" -depth -delete
          fi
          for checkout in "${GITHUB_WORKSPACE}/producer" "${GITHUB_WORKSPACE}/coverage-tooling"; do
            if [[ -d "${checkout}" ]]; then
              find "${checkout}" -type d -exec chmod u+w {} +
              find "${checkout}" -depth -delete
            fi
          done

  required:
    name: Required
    if: always()
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "${CI_RESULT}" = success
