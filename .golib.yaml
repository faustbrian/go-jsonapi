schema_version: 1
tool_version: v1.8.5
tool_checksums_sha256: 57f81a14b32fa629f9ed5c9cc6edc62c171095f5da6e36fa989dc12442fe1983

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: ".verification"

mutation:
  root: ".verification/mutation"
  imports:
    - module: "."
      archive: ".verification/mutation/bootstrap/root.zip"
      ledger: ".verification/mutation/migration-ledger.json"

api:
  baselines:
    - module: "."
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: "."
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzUnmarshal$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzUnmarshalAtomic$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseQuery$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzCursorPaginationQuery$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzNegotiation$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzConstructedDocumentValidation$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzMemberRegistry$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzCursorMetadata$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzMarshalUnmarshalRoundTrip$'
        budget: 2s
        timeout: 2m
  - module: "."
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: "."
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 20m
  - module: "."
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: "."
    gate: benchmark
    steps:
      - type: go-test
        packages: ["."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
